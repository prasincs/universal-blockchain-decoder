# Netlify configuration for Universal Blockchain Decoder WASM Demo
#
# This file allows Netlify to build the WASM module from source
# instead of receiving pre-built artifacts from GitHub Actions.
#
# Documentation: https://docs.netlify.com/configure-builds/file-based-configuration/

[build]
  # Base directory for build (where the build command runs)
  base = "crates/universal-decoder-wasm"

  # Build command
  command = "./build.sh"

  # Output directory (what gets deployed)
  publish = "www"

  # Environment variables for build
  [build.environment]
    # Disable submodule initialization (vendored deps have broken .gitmodules)
    NETLIFY_USE_SUBMODULES = "false"

    # Rust version (Netlify uses rustup)
    RUST_VERSION = "1.75.0"  # Or "stable"

    # Ensure wasm32 target is installed
    RUSTUP_TOOLCHAIN = "stable"

# Production deploy settings (main branch)
[context.production]
  command = "./build.sh"
  publish = "www"

# Deploy previews (all other branches)
[context.deploy-preview]
  command = "./build.sh"
  publish = "www"

# Branch-specific settings (if needed)
[context.branch-deploy]
  command = "./build.sh"
  publish = "www"

# Headers for proper WASM serving
[[headers]]
  for = "*.wasm"
  [headers.values]
    Content-Type = "application/wasm"
    Access-Control-Allow-Origin = "*"

[[headers]]
  # Headers for pkg directory WASM files
  for = "/pkg/*.wasm"
  [headers.values]
    Content-Type = "application/wasm"
    Access-Control-Allow-Origin = "*"

[[headers]]
  # Apply headers to all files
  for = "/*"
  [headers.values]
    # Enable CORS
    Access-Control-Allow-Origin = "*"
    # Security headers
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "SAMEORIGIN"
    X-XSS-Protection = "1; mode=block"

# Redirect rules for SPA behavior
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
  # Don't redirect if it's an actual file
  conditions = {path = "!*.js,!*.css,!*.wasm,!*.html,!*.json"}

# Plugin configuration (optional)
# [[plugins]]
#   package = "@netlify/plugin-lighthouse"
