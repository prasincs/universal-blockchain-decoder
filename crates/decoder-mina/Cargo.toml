[package]
name = "decoder-mina"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "Mina Protocol transaction decoder - zkApp transactions and account updates"

[dependencies]
# Core decoder infrastructure
universal-decoder-core = { path = "../universal-decoder-core" }
decoder-primitives = { path = "../decoder-primitives" }
decoder-encodings = { path = "../decoder-encodings" }
decoder-crypto-zk = { path = "../decoder-crypto-zk" }

# Minimal production dependencies
serde = { workspace = true }
thiserror = { workspace = true }
borsh = { workspace = true }

# Base58 for Mina addresses (base58check)
bs58 = { version = "0.5", default-features = false, features = ["alloc"] }

[dev-dependencies]
decoder-test-utils = { path = "../decoder-test-utils" }
serde_json = { workspace = true }
proptest = { workspace = true }
hex = "0.4"

# For test validation (cross-checking with Mina reference implementations)
# NOTE: These are in dev-dependencies only - we use pure Rust for production
# No direct Mina client library exists in Rust, but we can use JSON fixtures
