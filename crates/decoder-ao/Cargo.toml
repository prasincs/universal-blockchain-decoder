[package]
name = "decoder-ao"
version = "0.1.0"
edition = "2021"
authors = ["Universal Blockchain Decoder Contributors"]
license = "MIT OR Apache-2.0"
description = "Arweave AO (Actor Oriented) blockchain transaction decoder"
repository = "https://github.com/prasincs/universal-blockchain-decoder"
keywords = ["blockchain", "arweave", "ao", "decoder", "ans-104"]
categories = ["cryptography::cryptocurrencies"]

[dependencies]
universal-decoder-core = { path = "../universal-decoder-core" }
decoder-primitives = { path = "../decoder-primitives" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
borsh = { version = "1.3", features = ["derive"] }
thiserror = "1.0"
sha2 = "0.10"

[dev-dependencies]
proptest = "1.0"
decoder-test-utils = { path = "../decoder-test-utils" }

[features]
default = []
