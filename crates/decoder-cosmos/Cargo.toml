[package]
name = "decoder-cosmos"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "Cosmos transaction decoder for universal-decoder"

[dependencies]
universal-decoder-core = { path = "../universal-decoder-core" }
decoder-primitives = { path = "../decoder-primitives" }
serde = { workspace = true }
borsh = { version = "1.3", default-features = true, features = ["derive", "std"] }
thiserror = { workspace = true }
prost = "0.13"
prost-types = "0.13"
sha2 = "0.10"
bech32 = "0.11"
cosmos-sdk-proto = { version = "0.25", default-features = false }
# IBC support
ibc-proto = { version = "0.47", default-features = false }

[dev-dependencies]
serde_json = { workspace = true }
proptest = { workspace = true }
# IBC testing
ibc-proto = "0.47"
