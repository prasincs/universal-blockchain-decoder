# Netlify configuration for Universal Blockchain Decoder WASM Demo
#
# This file allows Netlify to build the WASM module from source
# instead of receiving pre-built artifacts from GitHub Actions.
#
# Documentation: https://docs.netlify.com/configure-builds/file-based-configuration/

[build]
  # Base directory for build (where the build command runs)
  base = "crates/universal-decoder-wasm"

  # Build command
  command = "./build.sh"

  # Output directory (what gets deployed)
  publish = "www"

  # Environment variables for build
  [build.environment]
    # Rust version (Netlify uses rustup)
    RUST_VERSION = "1.75.0"  # Or "stable"

    # Ensure wasm32 target is installed
    RUSTUP_TOOLCHAIN = "stable"

# Production deploy settings (main branch)
[context.production]
  command = "./build.sh"
  publish = "www"

# Deploy previews (all other branches)
[context.deploy-preview]
  command = "./build.sh"
  publish = "www"

# Branch-specific settings (if needed)
[context.branch-deploy]
  command = "./build.sh"
  publish = "www"

# Headers for proper WASM serving
[[headers]]
  for = "*.wasm"
  [headers.values]
    Content-Type = "application/wasm"
    Access-Control-Allow-Origin = "*"

# Redirect rules (if needed)
