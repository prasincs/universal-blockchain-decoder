[package]
name = "universal-decoder-wasm"
version = "0.1.0"
edition = "2021"
authors = ["Universal Blockchain Decoder Contributors"]
description = "WebAssembly bindings for universal-blockchain-decoder"
license = "MIT OR Apache-2.0"
repository = "https://github.com/prasincs/universal-blockchain-decoder"

[package.metadata.wasm-pack.profile.release]
wasm-opt = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
# Core decoder and chain-specific decoders (reusing existing implementations!)
universal-decoder-core = { path = "../universal-decoder-core" }

# Bitcoin family
decoder-bitcoin = { path = "../decoder-bitcoin" }
decoder-bitcoin-cash = { path = "../decoder-bitcoin-cash" }
decoder-dogecoin = { path = "../decoder-dogecoin" }
decoder-litecoin = { path = "../decoder-litecoin" }
decoder-dash = { path = "../decoder-dash" }
decoder-zcash = { path = "../decoder-zcash" }

# Ethereum and EVM chains
decoder-ethereum = { path = "../decoder-ethereum" }
decoder-polygon = { path = "../decoder-polygon" }
decoder-arbitrum = { path = "../decoder-arbitrum" }
decoder-optimism = { path = "../decoder-optimism" }
decoder-avalanche = { path = "../decoder-avalanche" }
decoder-bnb = { path = "../decoder-bnb" }

# Other major chains
decoder-solana = { path = "../decoder-solana" }
decoder-cosmos = { path = "../decoder-cosmos" }
decoder-near = { path = "../decoder-near" }
decoder-aptos = { path = "../decoder-aptos" }
decoder-sui = { path = "../decoder-sui" }
decoder-algorand = { path = "../decoder-algorand" }
decoder-cardano = { path = "../decoder-cardano" }
decoder-polkadot = { path = "../decoder-polkadot" }
decoder-stellar = { path = "../decoder-stellar" }
decoder-tron = { path = "../decoder-tron" }
decoder-starknet = { path = "../decoder-starknet" }
decoder-xrp = { path = "../decoder-xrp" }

# WASM infrastructure
wasm-bindgen = "0.2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde-wasm-bindgen = "0.6"
console_error_panic_hook = "0.1"

# WASM-specific dependencies
getrandom = { version = "0.2", features = ["js"] }  # Required for WASM targets

# Logging in browser console
web-sys = { version = "0.3", features = ["console"] }

[dev-dependencies]
wasm-bindgen-test = "0.3"

[profile.release]
opt-level = "z"     # Optimize for size
lto = true          # Link-time optimization
codegen-units = 1   # Single codegen unit for better optimization
strip = true        # Strip symbols
