[package]
name = "universal-decoder-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "Command-line interface for universal blockchain transaction decoder"

[[bin]]
name = "universal-tx-decoder"
path = "src/main.rs"

[dependencies]
# Core library
universal-decoder-core = { path = "../universal-decoder-core" }

# All available decoders
decoder-bitcoin = { path = "../decoder-bitcoin" }
decoder-ethereum = { path = "../decoder-ethereum" }
decoder-zcash = { path = "../decoder-zcash" }
decoder-evm = { path = "../decoder-evm" }
decoder-svm = { path = "../decoder-svm" }
decoder-litecoin = { path = "../decoder-litecoin" }
decoder-dogecoin = { path = "../decoder-dogecoin" }
decoder-bitcoin-cash = { path = "../decoder-bitcoin-cash" }
decoder-bitcoin-sv = { path = "../decoder-bitcoin-sv" }
decoder-dash = { path = "../decoder-dash" }
decoder-bnb = { path = "../decoder-bnb" }
decoder-polygon = { path = "../decoder-polygon" }
decoder-avalanche = { path = "../decoder-avalanche" }
decoder-optimism = { path = "../decoder-optimism" }
decoder-arbitrum = { path = "../decoder-arbitrum" }
decoder-chains-common = { path = "../decoder-chains-common" }

# CLI-specific dependencies (not in core library)
clap = { version = "4.5", features = ["derive", "env"] }
anyhow = "1.0.100"
serde_json = "1.0"  # For RPC JSON communication (CLI only, NOT in core)

# Security: Protect sensitive data in memory
secrecy = { version = "0.8", features = ["serde"] }
zeroize = "1.8"

# Network functionality (CLI only - NOT in core library)
# IMPORTANT: Network code is ONLY allowed in CLI binary, never in core library
# This preserves airgapped operation for security-critical deployments
reqwest = { version = "0.12", features = ["json", "blocking"] }
url = "2.5"
base64 = "0.22"  # For Solana transaction decoding

[dev-dependencies]
# For testing CLI
assert_cmd = "2.0"
predicates = "3.1"
tempfile = "3.0"
