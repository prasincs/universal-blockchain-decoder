[package]
name = "universal-decoder-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "Command-line interface for universal blockchain transaction decoder"

[[bin]]
name = "universal-tx-decoder"
path = "src/main.rs"

[dependencies]
universal-decoder-core = { path = "../universal-decoder-core" }
decoder-bitcoin = { path = "../decoder-bitcoin" }
decoder-ethereum = { path = "../decoder-ethereum" }

# CLI-specific dependencies (not in core library)
clap = { version = "4.5", features = ["derive"] }

[dev-dependencies]
# For testing CLI
assert_cmd = "2.0"
predicates = "3.1"
