[package]
name = "decoder-algorand"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "Algorand transaction decoder for universal-decoder"

[dependencies]
universal-decoder-core = { path = "../universal-decoder-core" }
decoder-primitives = { path = "../decoder-primitives" }
serde = { workspace = true, features = ["derive"] }
thiserror = { workspace = true }
rmp-serde = "1.1"
base64 = "0.21"
sha2 = "0.10"

[dev-dependencies]
serde_json = { workspace = true }
proptest = { workspace = true }
# algonaut 0.4 removed: every 0.4.x release of its `algonaut_client`
# dependency was yanked from crates.io, making the whole workspace
# unresolvable. It was declared "for validation ONLY" but no test ever
# imported it. Re-add a pinned, actually-used version when differential
# tests for Algorand are written (see loop/BACKLOG.md).
hex = "0.4"
