[package]
name = "decoder-ethereum"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "Ethereum transaction decoder for universal-decoder"

[features]
# Enable formal verification support (Verus annotations)
formal-verification = []
# Alloy validation feature (currently disabled, requires alloy-rs dependencies)
alloy-validation = []

[dependencies]
universal-decoder-core = { path = "../universal-decoder-core" }
decoder-encodings = { path = "../decoder-encodings" }
serde = { workspace = true }
borsh = { version = "1.3", default-features = true, features = ["derive", "std"] }
thiserror = { workspace = true }
# hex - Use vendored version via: use universal_decoder_core::hex;
sha3 = { workspace = true }
# ECDSA signature recovery (RustCrypto - audited)
k256 = { version = "0.13", features = ["ecdsa", "std"] }

[dev-dependencies]
# Testing utilities
proptest = { workspace = true }
serde_json = { workspace = true }
decoder-test-utils = { path = "../decoder-test-utils" }

# Alloy-rs: upstream Ethereum implementation, used as the differential
# oracle in tests/alloy_differential.rs. VALIDATION ONLY - production code
# uses pure Rust parsing. Versions are pinned by Cargo.lock.
alloy-primitives = "1.0"
alloy-consensus = { version = "2.1", features = ["k256"] }
alloy-eips = "2.1"
