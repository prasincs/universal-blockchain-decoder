[package]
name = "decoder-ethereum"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "Ethereum transaction decoder for universal-decoder"

[features]
# Alloy validation feature (currently disabled, requires alloy-rs dependencies)
alloy-validation = []

[dependencies]
universal-decoder-core = { path = "../universal-decoder-core" }
serde = { workspace = true }
thiserror = { workspace = true }
# hex - Use vendored version via: use universal_decoder_core::hex;
sha3 = { workspace = true }

[dev-dependencies]
# Testing utilities
proptest = { workspace = true }
serde_json = { workspace = true }

# Alloy-rs: Modern Ethereum library for VALIDATION ONLY
# Production code uses pure Rust parsing
# NOTE: Temporarily commented out due to version conflicts
# Can be added back later for validation tests
# alloy-rlp = "0.3"
# alloy-primitives = { version = "0.8", features = ["rlp"] }
# alloy-consensus = { version = "0.8", features = ["std"] }
