[package]
name = "decoder-chains-common"
version = "0.1.0"
edition = "2021"
authors = ["Universal Blockchain Decoder Contributors"]
license = "MIT OR Apache-2.0"
description = "Common utilities and patterns for blockchain decoder implementations"
repository = "https://github.com/prasincs/universal-blockchain-decoder"
keywords = ["blockchain", "decoder", "transaction", "bitcoin", "ethereum"]
categories = ["cryptography::cryptocurrencies", "parsing"]

[dependencies]
# Core dependencies
universal-decoder-core = { path = "../universal-decoder-core", version = "0.1.0" }

# Serialization
serde = { version = "1.0", features = ["derive"] }
borsh = { version = "1.3", features = ["derive"] }

# Error handling
thiserror = "1.0"

# Cryptography
sha2 = "0.10"
sha3 = "0.10"

[dev-dependencies]
# Testing
proptest = "1.5"

[features]
default = []
