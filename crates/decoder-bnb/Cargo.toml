[package]
name = "decoder-bnb"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "BNB Chain (BSC) transaction decoder for universal-decoder"

[dependencies]
universal-decoder-core = { path = "../universal-decoder-core" }
decoder-primitives = { path = "../decoder-primitives" }
decoder-ethereum = { path = "../decoder-ethereum" }
serde = { workspace = true }
thiserror = { workspace = true }

[dev-dependencies]
# BNB reuses the Ethereum decoder wholesale (TxSpecific = EthereumTransaction),
# so the alloy differential suite in decoder-ethereum already validates every
# byte of BNB's decode path. A separate alloy dev-dep here would only re-test
# identical code while carrying supply-chain/yank risk, so it is intentionally
# absent (see loop/BACKLOG.md "BNB vs alloy").
serde_json = { workspace = true }
proptest = { workspace = true }
