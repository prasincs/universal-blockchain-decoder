[package]
name = "decoder-bnb"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "BNB Chain (BSC) transaction decoder for universal-decoder"

[dependencies]
universal-decoder-core = { path = "../universal-decoder-core" }
decoder-primitives = { path = "../decoder-primitives" }
decoder-ethereum = { path = "../decoder-ethereum" }
serde = { workspace = true }
thiserror = { workspace = true }

[dev-dependencies]
# BNB reuses the Ethereum decoder verbatim (see src/lib.rs: BnbDecoder::decode
# delegates to EthereumDecoder). Its RLP/field decoding is validated by the
# Ethereum alloy differential suite (decoder-ethereum/tests/alloy_differential.rs),
# so no separate alloy oracle is declared here.
serde_json = { workspace = true }
proptest = { workspace = true }
