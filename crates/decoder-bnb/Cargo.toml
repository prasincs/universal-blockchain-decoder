[package]
name = "decoder-bnb"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "BNB Chain (BSC) transaction decoder for universal-decoder"

[dependencies]
universal-decoder-core = { path = "../universal-decoder-core" }
decoder-primitives = { path = "../decoder-primitives" }
decoder-ethereum = { path = "../decoder-ethereum" }
serde = { workspace = true }
thiserror = { workspace = true }

[dev-dependencies]
# BNB reuses the Ethereum decoder verbatim; the identical RLP parse path is
# covered field-for-field by decoder-ethereum's `alloy_differential` test, so
# no alloy oracle is declared here (dead deps carry yank risk with zero value).
serde_json = { workspace = true }
proptest = { workspace = true }
