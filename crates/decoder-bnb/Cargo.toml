[package]
name = "decoder-bnb"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "BNB Chain (BSC) transaction decoder for universal-decoder"

[dependencies]
universal-decoder-core = { path = "../universal-decoder-core" }
decoder-primitives = { path = "../decoder-primitives" }
decoder-ethereum = { path = "../decoder-ethereum" }
serde = { workspace = true }
thiserror = { workspace = true }

[dev-dependencies]
# BNB decoding delegates entirely to EthereumDecoder (see src/lib.rs), so the
# EVM/alloy differential coverage lives in decoder-ethereum's alloy_differential
# suite. No separate alloy oracle is declared here: unused dev-deps are
# supply-chain risk with zero validation value (a yanked algonaut dep already
# broke the workspace once).
serde_json = { workspace = true }
proptest = { workspace = true }
