[package]
name = "decoder-bnb"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "BNB Chain (BSC) transaction decoder for universal-decoder"

[dependencies]
universal-decoder-core = { path = "../universal-decoder-core" }
decoder-primitives = { path = "../decoder-primitives" }
decoder-ethereum = { path = "../decoder-ethereum" }
serde = { workspace = true }
thiserror = { workspace = true }

[dev-dependencies]
# No alloy oracle dev-deps: BNB reuses EthereumDecoder, so the RLP parse is
# already covered by decoder-ethereum's `alloy_differential` suite (see README).
serde_json = { workspace = true }
proptest = { workspace = true }
