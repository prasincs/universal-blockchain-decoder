[package]
name = "decoder-bnb"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "BNB Chain (BSC) transaction decoder for universal-decoder"

[dependencies]
universal-decoder-core = { path = "../universal-decoder-core" }
decoder-primitives = { path = "../decoder-primitives" }
decoder-ethereum = { path = "../decoder-ethereum" }
serde = { workspace = true }
thiserror = { workspace = true }

[dev-dependencies]
# BNB reuses decoder-ethereum wholesale (see src/lib.rs); the bytes->TxIR path
# is validated by decoder-ethereum's `alloy_differential` suite and
# decoder-evm's multi_chain_tests (chain 56). An alloy dev-dep here would only
# re-run the same EthereumDecoder::decode, so it was removed as a dead dep.
serde_json = { workspace = true }
proptest = { workspace = true }
