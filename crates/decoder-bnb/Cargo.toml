[package]
name = "decoder-bnb"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "BNB Chain (BSC) transaction decoder for universal-decoder"

[dependencies]
universal-decoder-core = { path = "../universal-decoder-core" }
decoder-primitives = { path = "../decoder-primitives" }
decoder-ethereum = { path = "../decoder-ethereum" }
serde = { workspace = true }
thiserror = { workspace = true }

[dev-dependencies]
# NOTE: BNB reuses the Ethereum decoder verbatim (TxSpecific = EthereumTransaction,
# decode = EthereumDecoder::decode + a BNB chain-id check). The byte->field decoding
# is already covered field-for-field by decoder-ethereum's alloy differential test
# (crates/decoder-ethereum/tests/alloy_differential.rs), so no separate alloy oracle
# is duplicated here (removed dead alloy-primitives / alloy-rlp dev-deps, 2026-07).
serde_json = { workspace = true }
proptest = { workspace = true }
