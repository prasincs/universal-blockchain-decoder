[package]
name = "decoder-bnb"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "BNB Chain (BSC) transaction decoder for universal-decoder"

[dependencies]
universal-decoder-core = { path = "../universal-decoder-core" }
decoder-primitives = { path = "../decoder-primitives" }
decoder-ethereum = { path = "../decoder-ethereum" }
serde = { workspace = true }
thiserror = { workspace = true }

[dev-dependencies]
# BNB Chain reuses the Ethereum decoder verbatim (see src/lib.rs). The RLP
# decode path is already differentially tested against alloy in
# `decoder-ethereum` (tests/alloy_differential.rs), so no alloy oracle is
# declared here — the only BNB-specific logic is the chain-ID gate, covered
# by `tests/bnb_chain_id_gate.rs` using a real Ethereum mainnet transaction.
serde_json = { workspace = true }
proptest = { workspace = true }
