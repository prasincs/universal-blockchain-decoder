[package]
name = "decoder-bnb"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "BNB Chain (BSC) transaction decoder for universal-decoder"

[dependencies]
universal-decoder-core = { path = "../universal-decoder-core" }
decoder-primitives = { path = "../decoder-primitives" }
decoder-ethereum = { path = "../decoder-ethereum" }
serde = { workspace = true }
thiserror = { workspace = true }

[dev-dependencies]
# BNB reuses decoder-ethereum, whose alloy differential suite is the alloy
# oracle. No alloy dev-deps are declared here: unused upstream dev-deps carry
# yank risk with zero validation value (see loop/BACKLOG.md dead-dep policy).
serde_json = { workspace = true }
proptest = { workspace = true }
