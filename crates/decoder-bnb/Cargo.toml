[package]
name = "decoder-bnb"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "BNB Chain (BSC) transaction decoder for universal-decoder"

[dependencies]
universal-decoder-core = { path = "../universal-decoder-core" }
decoder-primitives = { path = "../decoder-primitives" }
decoder-ethereum = { path = "../decoder-ethereum" }
serde = { workspace = true }
thiserror = { workspace = true }

[dev-dependencies]
# BNB reuses decoder-ethereum verbatim (TxSpecific = EthereumTransaction,
# decode via EthereumDecoder), so the differential validation against alloy
# lives in decoder-ethereum's `alloy_differential` test. The alloy dev-deps
# here were never imported by any BNB test (dead validation deps) and are
# dropped to remove yank risk; add them back only if BNB grows chain-specific
# decode logic that needs its own oracle.
serde_json = { workspace = true }
proptest = { workspace = true }
