[package]
name = "decoder-bnb"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "BNB Chain (BSC) transaction decoder for universal-decoder"

[dependencies]
universal-decoder-core = { path = "../universal-decoder-core" }
decoder-primitives = { path = "../decoder-primitives" }
decoder-ethereum = { path = "../decoder-ethereum" }
serde = { workspace = true }
thiserror = { workspace = true }

[dev-dependencies]
# BNB Chain reuses the Ethereum decoder verbatim (BnbDecoder::TxSpecific ==
# EthereumTransaction), so decoding correctness is covered by decoder-ethereum's
# alloy differential suite (tests/alloy_differential.rs). No separate alloy
# oracle is declared here: a declared-but-unused dev-dep carries yank risk with
# zero validation value. See loop/BACKLOG.md "BNB vs alloy".
serde_json = { workspace = true }
proptest = { workspace = true }
