[package]
name = "decoder-bnb"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "BNB Chain (BSC) transaction decoder for universal-decoder"

[dependencies]
universal-decoder-core = { path = "../universal-decoder-core" }
decoder-primitives = { path = "../decoder-primitives" }
decoder-ethereum = { path = "../decoder-ethereum" }
serde = { workspace = true }
thiserror = { workspace = true }

[dev-dependencies]
# BNB reuses the Ethereum decoder byte-for-byte (see src/lib.rs), so BNB's RLP
# parsing is validated by decoder-ethereum's `alloy_differential` suite. No
# direct alloy dev-dep here — a declared-but-unused upstream dev-dep is
# supply-chain yank risk with zero validation value.
serde_json = { workspace = true }
proptest = { workspace = true }
