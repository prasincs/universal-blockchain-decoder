[package]
name = "decoder-filecoin"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "Filecoin transaction decoder for universal-decoder"

[dependencies]
universal-decoder-core = { path = "../universal-decoder-core" }
decoder-primitives = { path = "../decoder-primitives" }
decoder-chains-common = { path = "../decoder-chains-common" }
decoder-encodings = { path = "../decoder-encodings" }
serde = { workspace = true }
borsh = { version = "1.3", default-features = true, features = ["derive", "std"] }
thiserror = { workspace = true }
sha2 = { workspace = true }
# CBOR parsing - battle-tested, minimal, no_std compatible
minicbor = { version = "0.20", default-features = false, features = ["alloc"] }

[dev-dependencies]
# Filecoin libraries for test validation ONLY
# Production code uses pure Rust CBOR parsing
# TODO: Add fvm-ipld-encoding or similar for validation once tests are written
serde_json = { workspace = true }
proptest = { workspace = true }
decoder-test-utils = { path = "../decoder-test-utils" }
