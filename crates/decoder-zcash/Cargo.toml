[package]
name = "decoder-zcash"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "Zcash transaction decoder for universal-decoder (transparent + shielded)"

[dependencies]
universal-decoder-core = { path = "../universal-decoder-core" }
decoder-primitives = { path = "../decoder-primitives" }
decoder-encodings = { path = "../decoder-encodings" }
decoder-chains-common = { path = "../decoder-chains-common" }
decoder-bitcoin = { path = "../decoder-bitcoin" }
serde = { workspace = true }
serde_bytes = "0.11"
thiserror = { workspace = true }
sha2 = { workspace = true }
blake2b_simd = "1.0"
# hex - Use vendored version via: use universal_decoder_core::hex;

# Cryptographic dependencies
# Note: redjubjub vendored in vendored/redjubjub/ (git subtree from ZcashFoundation/redjubjub@0.7.0)
# For now using Cargo dependency for ease of use; full vendoring integration is future work
jubjub = "0.10.0"           # Sapling elliptic curve (ECDH key agreement)
chacha20poly1305 = "0.10"   # ChaCha20-Poly1305 AEAD (note decryption)
redjubjub = "0.7.0"         # RedJubjub signature verification (vendored reference in vendored/redjubjub/)
# Future: pasta_curves, bls12_381 for Orchard and proof verification

[dev-dependencies]
# Blockchain libraries for test validation ONLY
# Production code uses pure Rust parsing
# zcash_primitives = "0.13"  # TODO: Enable after resolving dependency conflicts
serde_json = { workspace = true }
proptest = { workspace = true }
decoder-test-utils = { path = "../decoder-test-utils" }
