[package]
name = "decoder-solana"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "Solana transaction decoder for universal-decoder - Pure Rust implementation"

[dependencies]
universal-decoder-core = { path = "../universal-decoder-core" }
decoder-primitives = { path = "../decoder-primitives" }
decoder-encodings = { path = "../decoder-encodings" }
serde = { workspace = true }
thiserror = { workspace = true }
# hex - Use vendored version via: use universal_decoder_core::hex;

[dev-dependencies]
# Blockchain libraries for test validation ONLY
# Production code uses pure Rust parsing
# 4.x gates the whole crate root (EncodedTransaction, TransactionBinaryEncoding,
# and EncodedTransaction::decode) behind the `agave-unstable-api` feature.
solana-transaction-status = { version = "4", features = ["agave-unstable-api"] }
serde_json = { workspace = true }
proptest = { workspace = true }
base64 = "0.22"
decoder-test-utils = { path = "../decoder-test-utils" }

# Use solana-parser from tkhq for validation testing
# Note: This will be added as a git dependency
# solana-parser = { git = "https://github.com/tkhq/solana-parser", branch = "main" }
