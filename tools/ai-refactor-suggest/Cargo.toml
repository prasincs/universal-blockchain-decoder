[package]
name = "ai-refactor-suggest"
version = "0.1.0"
edition = "2021"
publish = false

[[bin]]
name = "ai-refactor-suggest"
path = "src/main.rs"

[dependencies]
# Universal decoder core for chain family definitions
universal-decoder-core = { path = "../../crates/universal-decoder-core" }

# HTTP client (reqwest is well-audited and widely used)
# Used to call Anthropic Claude API directly
reqwest = { version = "0.12", features = ["json"] }
tokio = { version = "1.0", features = ["full"] }

# Serialization
serde = { workspace = true, features = ["derive"] }
serde_json = "1.0"

# CLI
clap = { version = "4.5", features = ["derive"] }

# Error handling
anyhow = "1.0"
thiserror = { workspace = true }

# File I/O and path handling
walkdir = "2.5"
glob = "0.3"

# TOML parsing for Cargo.toml
toml = "0.8"

# Time/date for reports
chrono = "0.4"

# Regex for parsing responses
regex = "1.10"
