[package]
name = "chain-registry-generator"
version = "0.1.0"
edition = "2021"
publish = false

[dependencies]
# Reuse decoder-evm types
decoder-evm = { path = "../../crates/decoder-evm" }

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
borsh = { version = "1.3", features = ["derive"] }

# CLI
clap = { version = "4.5", features = ["derive"] }

# Error handling
anyhow = "1.0"

# File I/O
walkdir = "2.5"
chrono = "0.4"
