name: Deploy WASM Preview (Cloudflare Pages) - BACKUP

# BACKUP: User has existing Netlify setup at trustless-txir.netlify.app
# Using Netlify workflow instead. Keep this as fallback option.

on:
  workflow_dispatch:  # Manual trigger only
  # pull_request:
    paths:
      - 'crates/universal-decoder-wasm/**'
      - 'crates/universal-decoder-core/**'
      - 'crates/decoder-*/**'
      - '.github/workflows/deploy-wasm-preview-cloudflare.yml'
  push:
    branches-ignore:
      - main
    paths:
      - 'crates/universal-decoder-wasm/**'
      - 'crates/universal-decoder-core/**'
      - 'crates/decoder-*/**'

# Environment variables from repository secrets
# Required secrets:
#   CLOUDFLARE_API_TOKEN - Your Cloudflare API token
#   CLOUDFLARE_ACCOUNT_ID - Your Cloudflare account ID

jobs:
  build-and-deploy-preview:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write
      pull-requests: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Cache cargo registry
        uses: actions/cache@v3
        with:
          path: ~/.cargo/registry
          key: ${{ runner.os }}-cargo-registry-${{ hashFiles('**/Cargo.lock') }}

      - name: Cache cargo index
        uses: actions/cache@v3
        with:
          path: ~/.cargo/git
          key: ${{ runner.os }}-cargo-index-${{ hashFiles('**/Cargo.lock') }}

      - name: Cache target directory
        uses: actions/cache@v3
        with:
          path: target
          key: ${{ runner.os }}-target-wasm-${{ hashFiles('**/Cargo.lock') }}

      - name: Install wasm-pack
        run: curl https://rustwasm.github.io/wasm-pack/installer/init.sh -sSf | sh

      - name: Install wasm-opt
        run: |
          sudo apt-get update
          sudo apt-get install -y binaryen

      - name: Build WASM module
        run: |
          cd crates/universal-decoder-wasm
          chmod +x build.sh
          ./build.sh

      - name: Show bundle size
        run: |
          echo "📦 WASM Bundle Size:"
          ls -lh crates/universal-decoder-wasm/www/pkg/*.wasm
          echo ""
          echo "📊 Total www/ directory size:"
          du -sh crates/universal-decoder-wasm/www/

      # Deploy to Cloudflare Pages
      - name: Publish to Cloudflare Pages
        id: cloudflare
        uses: cloudflare/pages-action@v1
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          projectName: universal-blockchain-decoder
          directory: ./crates/universal-decoder-wasm/www
          # Optional: Git integration
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}
          branch: ${{ github.head_ref || github.ref_name }}

      - name: Comment PR with preview URL
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const url = '${{ steps.cloudflare.outputs.url }}';
            const body = `### 🚀 WASM Preview Deployed (Cloudflare Pages)

            **Preview URL:** ${url}

            📦 **Bundle Size:** See workflow logs for details
            🔧 **Build:** ${{ github.sha }}
            ⚡ **Cloudflare Edge Network:** Global CDN

            ---
            *Automatically deployed by Cloudflare Pages*`;

            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: body
            });

      - name: Output deployment URL
        run: |
          echo "✅ WASM Preview deployed successfully!"
          echo "🔗 Preview URL: ${{ steps.cloudflare.outputs.url }}"
          echo "🌍 Deployment ID: ${{ steps.cloudflare.outputs.id }}"
          echo "📋 Environment: ${{ steps.cloudflare.outputs.environment }}"
