name: Deploy WASM Demo to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'crates/universal-decoder-wasm/**'
      - 'crates/universal-decoder-core/**'
      - 'crates/decoder-*/**'
      - '.github/workflows/deploy-wasm-demo.yml'
  workflow_dispatch:  # Allow manual trigger

permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment
concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Cache cargo registry
        uses: actions/cache@v3
        with:
          path: ~/.cargo/registry
          key: ${{ runner.os }}-cargo-registry-${{ hashFiles('**/Cargo.lock') }}

      - name: Cache cargo index
        uses: actions/cache@v3
        with:
          path: ~/.cargo/git
          key: ${{ runner.os }}-cargo-index-${{ hashFiles('**/Cargo.lock') }}

      - name: Cache target directory
        uses: actions/cache@v3
        with:
          path: target
          key: ${{ runner.os }}-target-wasm-${{ hashFiles('**/Cargo.lock') }}

      - name: Install wasm-pack
        run: curl https://rustwasm.github.io/wasm-pack/installer/init.sh -sSf | sh

      - name: Install wasm-opt (optional, for further optimization)
        run: |
          sudo apt-get update
          sudo apt-get install -y binaryen

      - name: Build WASM module
        run: |
          cd crates/universal-decoder-wasm
          chmod +x build.sh
          ./build.sh

      - name: Show bundle size
        run: |
          echo "📦 WASM Bundle Size:"
          ls -lh crates/universal-decoder-wasm/www/pkg/*.wasm
          echo ""
          echo "📊 Total www/ directory size:"
          du -sh crates/universal-decoder-wasm/www/

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v2
        with:
          path: './crates/universal-decoder-wasm/www'

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v3

      - name: Comment deployment URL
        if: github.event_name == 'push'
        run: |
          echo "✅ WASM Demo deployed successfully!"
          echo "🔗 URL: ${{ steps.deployment.outputs.page_url }}"
