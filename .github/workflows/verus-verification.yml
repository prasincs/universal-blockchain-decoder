name: Verus Formal Verification

on:
  push:
    branches: [ main, claude/** ]
  pull_request:
    branches: [ main ]

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  verify:
    name: Verus Verification
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        # Future: add macos-latest, windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable

      - name: Cache Verus installation
        id: cache-verus
        uses: actions/cache@v4
        with:
          path: tools/verus-bin
          key: ${{ runner.os }}-verus-${{ hashFiles('scripts/install-verus.sh') }}

      - name: Install Verus
        if: steps.cache-verus.outputs.cache-hit != 'true'
        run: |
          chmod +x scripts/install-verus.sh
          INSTALL_DIR=./tools/verus-bin scripts/install-verus.sh

      - name: Add Verus to PATH
        run: echo "${{ github.workspace }}/tools/verus-bin" >> $GITHUB_PATH

      - name: Verify Verus installation
        run: |
          which verus || echo "tools/verus-bin/verus"
          ./tools/verus-bin/verus --version || echo "Verus installed (version check may not work)"

      - name: Run Verus on core library
        run: |
          chmod +x scripts/verus.sh
          # Verify specific modules with Verus annotations
          ./scripts/verus.sh crates/universal-decoder-core/src/canonical.rs --crate-type=lib || true
          # Note: || true for now since we're adding annotations progressively

      - name: Run Verus tests
        run: |
          # Run any dedicated Verus test files
          find crates/universal-decoder-core -name "*_verus.rs" -type f | while read -r file; do
            echo "Verifying $file"
            ./scripts/verus.sh "$file" || true
          done

      - name: Summary
        if: always()
        run: |
          echo "Verus verification completed"
          echo "Note: Verification is progressive - failures are expected during development"
