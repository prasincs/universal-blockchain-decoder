name: Auto-Update Documentation

on:
  # Run nightly at 2:00 AM UTC
  schedule:
    - cron: '0 2 * * *'

  # Allow manual triggering
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run (don''t commit changes)'
        required: false
        type: boolean
        default: false
      create_pr:
        description: 'Create pull request with changes'
        required: false
        type: boolean
        default: true

  # Also run on pushes to main that affect code
  push:
    branches:
      - main
    paths:
      - 'crates/**/*.rs'
      - 'crates/**/Cargo.toml'
      - 'tools/**/*.rs'
      - 'tools/**/Cargo.toml'

permissions:
  contents: write
  pull-requests: write

jobs:
  update-docs:
    name: Update Documentation and Diagrams
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Fetch all history for git analysis
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Rust
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable

      - name: Cache Cargo dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-auto-update-docs-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-auto-update-docs-
            ${{ runner.os }}-cargo-

      - name: Build auto-update-docs tool
        run: |
          cargo build --release -p auto-update-docs

      - name: Configure git
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

      - name: Create branch for updates
        id: create-branch
        run: |
          BRANCH_NAME="auto-update-docs/$(date +%Y%m%d-%H%M%S)"
          echo "branch_name=$BRANCH_NAME" >> $GITHUB_OUTPUT
          git checkout -b "$BRANCH_NAME"

      - name: Run documentation update
        id: update-docs
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          if [ "${{ github.event.inputs.dry_run }}" = "true" ]; then
            cargo run --release -p auto-update-docs -- \
              --api-key "$ANTHROPIC_API_KEY" \
              --dry-run \
              --verbose
          else
            cargo run --release -p auto-update-docs -- \
              --api-key "$ANTHROPIC_API_KEY" \
              --verbose
          fi

      - name: Check for changes
        id: check-changes
        run: |
          if git diff --quiet && git diff --cached --quiet; then
            echo "has_changes=false" >> $GITHUB_OUTPUT
            echo "No documentation changes detected"
          else
            echo "has_changes=true" >> $GITHUB_OUTPUT
            echo "Documentation changes detected"
          fi

      - name: Commit changes
        if: steps.check-changes.outputs.has_changes == 'true' && github.event.inputs.dry_run != 'true'
        run: |
          git add docs/ *.md
          git commit -m "docs: Auto-update documentation and diagrams

          Updated documentation based on recent code changes.

          Changes include:
          - Architecture diagrams
          - Module documentation
          - Roadmap updates

          Generated by auto-update-docs tool (nightly run)"

      - name: Push changes
        if: steps.check-changes.outputs.has_changes == 'true' && github.event.inputs.dry_run != 'true'
        run: |
          git push -u origin ${{ steps.create-branch.outputs.branch_name }}

      - name: Create Pull Request
        if: |
          steps.check-changes.outputs.has_changes == 'true' &&
          github.event.inputs.dry_run != 'true' &&
          (github.event.inputs.create_pr == 'true' || github.event_name == 'schedule')
        uses: peter-evans/create-pull-request@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          branch: ${{ steps.create-branch.outputs.branch_name }}
          title: "docs: Auto-update documentation and architecture diagrams"
          body: |
            ## Auto-Generated Documentation Update

            This PR contains automated updates to documentation and architecture diagrams based on recent code changes.

            ### What's Updated

            - 📊 Architecture diagrams (Mermaid)
            - 📝 Module documentation
            - 🗺️ Roadmap status
            - 📚 API documentation

            ### How This Works

            The `auto-update-docs` tool:
            1. Analyzes the codebase structure and recent changes
            2. Uses Claude AI to generate updated documentation
            3. Creates Mermaid diagrams for architecture visualization
            4. Runs nightly via GitHub Actions

            ### Review Checklist

            - [ ] Verify diagram accuracy
            - [ ] Check for any incorrect information
            - [ ] Ensure documentation style is consistent
            - [ ] Confirm all module changes are reflected

            ---

            🤖 Generated by [auto-update-docs](tools/auto-update-docs)
            📅 Run date: ${{ github.run_id }}
            🔄 Trigger: ${{ github.event_name }}
          labels: |
            documentation
            auto-generated
            maintenance
          reviewers: |
            prasincs

      - name: Post summary
        if: always()
        run: |
          echo "## Documentation Update Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          if [ "${{ steps.check-changes.outputs.has_changes }}" = "true" ]; then
            echo "✅ Documentation updates generated" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "### Changed Files" >> $GITHUB_STEP_SUMMARY
            git diff --name-only HEAD^ | grep -E '\.(md)$' | while read file; do
              echo "- \`$file\`" >> $GITHUB_STEP_SUMMARY
            done
          else
            echo "ℹ️ No documentation updates needed" >> $GITHUB_STEP_SUMMARY
          fi

          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Tool Info" >> $GITHUB_STEP_SUMMARY
          echo "- Tool: \`auto-update-docs\`" >> $GITHUB_STEP_SUMMARY
          echo "- Run: ${{ github.run_id }}" >> $GITHUB_STEP_SUMMARY
          echo "- Trigger: ${{ github.event_name }}" >> $GITHUB_STEP_SUMMARY

  # Optional: Send notification on failure
  notify-failure:
    name: Notify on Failure
    runs-on: ubuntu-latest
    needs: update-docs
    if: failure()

    steps:
      - name: Create issue on failure
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: '🚨 Auto-update documentation workflow failed',
              body: `The nightly documentation update workflow failed.

              **Run:** ${context.runId}
              **Workflow:** ${context.workflow}
              **Trigger:** ${context.eventName}

              Please check the [workflow run](${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}) for details.`,
              labels: ['bug', 'automated', 'documentation']
            })
