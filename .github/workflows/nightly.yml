name: Nightly Tests

on:
  schedule:
    # Run at 2 AM UTC daily
    - cron: '0 2 * * *'
  workflow_dispatch:  # Allow manual trigger

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  # Job 1: Fuzz testing (nightly, scheduled) - 1 hour run
  fuzz-tests:
    name: Fuzz Testing
    runs-on: ubuntu-latest
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Rust nightly
        uses: dtolnay/rust-toolchain@nightly

      - name: Cache dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-fuzz-${{ hashFiles('**/Cargo.lock') }}

      - name: Install cargo-fuzz
        run: cargo install cargo-fuzz

      - name: Run fuzz tests (1 hour)
        run: |
          cd crates/universal-decoder-core
          if [ -d fuzz ]; then
            cargo fuzz run fuzz_canonical --release -- -max_total_time=3600
          else
            echo "Fuzz targets not yet implemented (Phase 1.5 PR #9)"
          fi
        continue-on-error: true

      - name: Upload fuzz artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: fuzz-artifacts
          path: |
            crates/*/fuzz/artifacts/

  # Job 2: Extended property tests (more iterations)
  extended-property-tests:
    name: Extended Property Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: Run property tests (extended)
        run: cargo test --test property_tests --all --verbose
        env:
          PROPTEST_CASES: 10000  # 10x more iterations for nightly

  # Job 3: Benchmark regression check
  benchmarks:
    name: Performance Benchmarks
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-bench-${{ hashFiles('**/Cargo.lock') }}

      - name: Run benchmarks
        run: cargo bench --all --verbose

      - name: Upload benchmark results
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-results
          path: target/criterion/

  # Job 4: Check for outdated dependencies
  dependency-updates:
    name: Dependency Updates Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install cargo-outdated
        run: cargo install cargo-outdated

      - name: Check for outdated dependencies
        run: cargo outdated --workspace --verbose

  # Job 5: Verify vendored dependencies haven't diverged
  verify-vendored-deps:
    name: Verify Vendored Dependencies
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Verify hex vendored version
        run: |
          # Check that vendored hex hasn't been modified
          cd crates/universal-decoder-core/src/vendored/hex

          # Verify git history is intact
          if [ -d .git ]; then
            echo "✅ Git history preserved for vendored hex"
            git log --oneline -5
          else
            echo "ℹ️  Vendored via git subtree (history in parent repo)"
          fi

      - name: Run vendored dependency tests
        run: |
          # Test that vendored dependencies work correctly
          cargo test -p universal-decoder-core --test vendored_hex_tests --verbose
