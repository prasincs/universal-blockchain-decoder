[workspace]
members = [
    "crates/universal-decoder-core",
    "crates/decoder-primitives",
    "crates/decoder-encodings",     # Shared encoding utilities (Phase 2.5)
    "crates/decoder-test-utils",    # Test utilities (Phase 2.5.2)
    "crates/decoder-bitcoin",
    "crates/decoder-ethereum",
    "crates/decoder-solana",
    "crates/decoder-evm",           # Generic EVM decoder for 2000+ chains
    "crates/universal-decoder-cli",

    # Top 20 chains scaffolding (Phase 1 - Scaffolding complete)
    # Phase 2 (Pure Rust implementations) - In progress
    "crates/decoder-bnb",           # BNB Chain (BSC) - EVM-compatible
    "crates/decoder-xrp",           # XRP Ledger - Binary codec
    "crates/decoder-cardano",       # Cardano - eUTXO with CBOR
    "crates/decoder-dogecoin",      # Dogecoin - Bitcoin fork (no SegWit)
    "crates/decoder-tron",          # Tron - Protobuf encoding
    "crates/decoder-polygon",       # Polygon - EVM-compatible L2
    "crates/decoder-avalanche",     # Avalanche C-Chain - EVM-compatible
    "crates/decoder-polkadot",      # Polkadot - SCALE encoding
    "crates/decoder-litecoin",      # Litecoin - Bitcoin fork (with SegWit)
    "crates/decoder-near",          # NEAR Protocol - Borsh encoding
    "crates/decoder-cosmos",        # Cosmos Hub - Protobuf + Tendermint
    "crates/decoder-stellar",       # Stellar - XDR encoding
    "crates/decoder-algorand",      # Algorand - MessagePack encoding
    "crates/decoder-optimism",      # Optimism - EVM L2 (Optimistic rollup)
    "crates/decoder-arbitrum",      # Arbitrum - EVM L2 (Optimistic rollup)
    "crates/decoder-sui",           # Sui - Move-based with BCS
    "crates/decoder-aptos",         # Aptos - Move-based with BCS

    "examples/simple-decoder",

    # Tools
    "tools/registry-generator",
    "tools/ai-refactor-suggest",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
authors = ["Universal Blockchain Decoder Contributors"]
repository = "https://github.com/prasincs/universal-blockchain-decoder"

[workspace.dependencies]
# Core dependencies for canonical serialization
borsh = { version = "1.3", default-features = false, features = ["derive"] }
# serde >= 1.0.127 required for:
#   - i128/u128 support (added in 1.0.60)
#   - const generics support in derive macros (serde_derive upgraded to syn 1.0+ around 1.0.127)
serde = { version = "1.0.127", features = ["derive"] }

# Cryptographic primitives
sha2 = "0.10"
sha3 = "0.10"

# Error handling
# thiserror >= 1.0.30 required for:
#   - #[from] attribute support with modern syn versions
#   - compatibility with other proc-macro dependencies
thiserror = "1.0.30"

# Testing (dev-dependencies only)
proptest = "1.4"
criterion = "0.5"
serde_json = "1.0"

# NOTE: Blockchain-specific dependencies (bitcoin, alloy, solana-sdk) are
# declared in individual decoder crates, NOT in workspace.
# This allows each decoder to manage its own dependencies and versions.
