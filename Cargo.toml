[workspace]
members = [
    "crates/universal-decoder-core",
    "crates/decoder-primitives",
    "crates/decoder-bitcoin",
    "crates/decoder-ethereum",
    # "crates/decoder-solana",  # Temporarily disabled due to dependency conflicts
    "examples/simple-decoder",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
authors = ["Universal Blockchain Decoder Contributors"]
repository = "https://github.com/prasincs/universal-blockchain-decoder"

[workspace.dependencies]
# Core dependencies for canonical serialization
parity-scale-codec = { version = "3.6", default-features = false, features = ["derive"] }
borsh = { version = "1.3", default-features = false, features = ["derive"] }
# serde >= 1.0.127 required for:
#   - i128/u128 support (added in 1.0.60)
#   - const generics support in derive macros (serde_derive upgraded to syn 1.0+ around 1.0.127)
serde = { version = "1.0.127", features = ["derive"] }
serde_json = "1.0"

# Cryptographic primitives
sha2 = "0.10"
sha3 = "0.10"
ripemd = "0.1"
# hex - VENDORED via git subtree (see universal-decoder-core/src/vendored/hex)

# Error handling
# thiserror >= 1.0.30 required for:
#   - #[from] attribute support with modern syn versions
#   - compatibility with other proc-macro dependencies
thiserror = "1.0.30"
anyhow = "1.0"

# Testing
proptest = "1.4"
criterion = "0.5"

# Utilities (shared across crates)
byteorder = "1.5"
smallvec = "1.11"

# NOTE: Blockchain-specific dependencies (bitcoin, alloy, solana-sdk) are
# declared in individual decoder crates, NOT in workspace.
# This allows each decoder to manage its own dependencies and versions.
