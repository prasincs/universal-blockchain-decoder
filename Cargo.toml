[workspace]
members = [
    "crates/universal-decoder-core",
    "crates/decoder-bitcoin",
    "crates/decoder-ethereum",
    # "crates/decoder-solana",  # Temporarily disabled due to dependency conflicts
    "examples/simple-decoder",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
authors = ["Universal Blockchain Decoder Contributors"]
repository = "https://github.com/prasincs/universal-blockchain-decoder"

[workspace.dependencies]
# Core dependencies for canonical serialization
parity-scale-codec = { version = "3.6", default-features = false, features = ["derive"] }
borsh = { version = "1.3", default-features = false, features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Cryptographic primitives
sha2 = "0.10"
sha3 = "0.10"
ripemd = "0.1"
hex = "0.4"

# Error handling
thiserror = "1.0"
anyhow = "1.0"

# Testing
proptest = "1.4"
criterion = "0.5"

# Blockchain-specific dependencies (for test validation only, Phase 1.5+)
bitcoin = "0.31"
# Using alloy-rs (modern successor to ethers)
alloy = "0.1"
alloy-primitives = "0.7"
alloy-rlp = "0.3"
solana-sdk = "1.17"
solana-transaction-status = "1.17"

# Utilities
byteorder = "1.5"
smallvec = "1.11"
