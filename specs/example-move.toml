# Example Move-based Chain Decoder Specification
#
# Template for Move chains (Aptos, Sui) using BCS encoding
# To generate: cargo run -p decoder-generator -- generate specs/example-move.toml

[chain]
name = "ExampleMove"
chain_id = 88888
family = "account"
description = "Example Move-based chain using BCS (Binary Canonical Serialization)"

[encoding]
endianness = "little"  # Move uses little-endian
hash = "sha256"  # Or blake2b, depends on chain
var_encoding = "bcs"  # Binary Canonical Serialization (includes ULEB128)

# Transaction format
[[transaction.fields]]
type = "var_bytes"
name = "sender"
max_size = 32

[[transaction.fields]]
type = "primitive"
name = "sequence_number"
prim_type = "u64"

[[transaction.fields]]
type = "primitive"
name = "max_gas_amount"
prim_type = "u64"

[transaction.txid]
exclude_fields = []
